<style>
#appContent > .grid:has(#userForm){grid-template-columns:minmax(0,1fr)}
#appContent > .grid:has(#userForm)>section{min-width:0}
@media(max-width:639px){
  #appContent > .grid:has(#userForm){gap:1rem}
  #appContent > .grid:has(#userForm)>section{padding:1rem;overflow:hidden}
  #appContent > .grid:has(#userForm)>section:has(#userForm)+section .overflow-x-auto{overflow:visible}
  #appContent > .grid:has(#userForm)>section:has(#userForm)+section table{display:block;width:100%;min-width:0!important}
  #appContent > .grid:has(#userForm)>section:has(#userForm)+section thead{display:none}
  #appContent > .grid:has(#userForm)>section:has(#userForm)+section tbody{display:block}
  #appContent > .grid:has(#userForm)>section:has(#userForm)+section tr{display:block;margin-bottom:.75rem;padding:.7rem .75rem;border:1px solid rgb(30 41 59);border-radius:.75rem}
  #appContent > .grid:has(#userForm)>section:has(#userForm)+section td{display:grid;grid-template-columns:82px minmax(0,1fr);gap:.65rem;padding:.4rem 0;text-align:left!important;overflow-wrap:anywhere}
}
</style>
