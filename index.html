<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>IMS</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <script defer src="./pwa.js?v=20260916-64"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root { --wellora-gold:#d3af36; }
        html, body { background:#000000 !important; color:#ffffff !important; }
        [class*="bg-slate-"] { background-color:#000000 !important; }
        [class*="text-slate-"] { color:#ffffff !important; }
        label, p, span { color:inherit; }
        input { background:#000000 !important; color:#ffffff !important; border-color:#4b5563 !important; }
        input:focus { border-color:var(--wellora-gold) !important; }
        #googleSignIn { background:#111111 !important; color:#ffffff !important; border:1px solid #333333; }
        #googleSignIn:hover { background:#1a1a1a !important; }
        #loginSubmit { background:var(--wellora-gold) !important; color:#000000 !important; }
        #loginSubmit:hover { filter:brightness(1.08); }
        #loginSubtitle { color:var(--wellora-gold) !important; }
        #loginDividerLabel { color:rgba(255,255,255,.7) !important; }
        #errorMsg { color:#f87171 !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-800 p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700 box-border">
        <div class="flex flex-col items-center text-center mb-6">
            <img src="./icon-192.png" width="192" height="192" alt="Wellora Energy" class="w-24 h-24 sm:w-28 sm:h-28 object-contain mb-3" draggable="false">
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white">IMS</h1>
            <div id="loginSubtitle" class="text-xs sm:text-sm font-bold uppercase tracking-[0.18em] mt-1">Portal Login</div>
        </div>
        <button id="googleSignIn" type="button" class="w-full font-semibold py-2.5 px-4 rounded-lg transition duration-200 text-sm flex items-center justify-center gap-3">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.715v2.258h2.909c1.703-1.568 2.684-3.878 2.684-6.614z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.181l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.584-5.037-3.712H.956v2.332A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.963 10.708A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.281-1.708V4.96H.956A9 9 0 0 0 0 9c0 1.45.347 2.823.956 4.04l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.507.454 3.44 1.346l2.582-2.582C13.463.892 11.426 0 9 0A9 9 0 0 0 .956 4.96l3.007 2.332C4.672 5.164 6.656 3.58 9 3.58z"/></svg>
            Sign in with Google
        </button>
        <div class="flex items-center gap-3 my-5"><div class="h-px bg-slate-700 flex-1"></div><span id="loginDividerLabel" class="text-xs">OR</span><div class="h-px bg-slate-700 flex-1"></div></div>
        <form id="loginForm" class="space-y-4">
            <div><label class="block text-sm font-medium mb-1 text-white">Email Address</label><input type="email" id="email" required class="w-full px-3 py-2.5 rounded-lg border focus:outline-none text-sm"></div>
            <div><label class="block text-sm font-medium mb-1 text-white">Password</label><input type="password" id="password" required class="w-full px-3 py-2.5 rounded-lg border focus:outline-none text-sm"></div>
            <button id="loginSubmit" type="submit" class="w-full font-bold py-2.5 px-4 rounded-lg transition duration-200 text-sm">Sign In</button>
        </form>
        <p id="errorMsg" class="text-xs sm:text-sm mt-4 text-center hidden break-words"></p>
    </div>
    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        const errorMsg=document.getElementById("errorMsg"),googleButton=document.getElementById("googleSignIn");
        function showError(message){errorMsg.innerText=message;errorMsg.classList.remove("hidden");}
        function clearError(){errorMsg.innerText="";errorMsg.classList.add("hidden");}
        async function authorizeAndRedirect(user){const userDoc=await getDoc(doc(db,"users",user.uid));if(!userDoc.exists()){await signOut(auth);showError("This Google account is not registered for IMS. Please contact an authorized manager or superadmin.");return;}const profile=userDoc.data();if(profile.status!=="active"){await signOut(auth);showError("This account is inactive. Please contact an authorized manager or superadmin.");return;}const role=profile.role;if(role==="superadmin")window.location.href="superadmin.html";else if(role==="manager")window.location.href="manager.html";else if(role==="admin")window.location.href="admin.html";else{await signOut(auth);showError("Role not authorized.");}}
        document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();clearError();try{await setPersistence(auth,browserSessionPersistence);const userCredential=await signInWithEmailAndPassword(auth,document.getElementById("email").value,document.getElementById("password").value);await authorizeAndRedirect(userCredential.user);}catch(err){showError(err.message);}});
        googleButton.addEventListener("click",async()=>{clearError();googleButton.disabled=true;googleButton.classList.add("opacity-60");try{await setPersistence(auth,browserSessionPersistence);const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});const result=await signInWithPopup(auth,provider);await authorizeAndRedirect(result.user);}catch(err){if(err?.code==="auth/popup-closed-by-user")showError("Google sign-in was cancelled.");else if(err?.code==="auth/account-exists-with-different-credential")showError("This email already uses another sign-in method. Sign in with your existing method first.");else showError(err.message);}finally{googleButton.disabled=false;googleButton.classList.remove("opacity-60");}});
    </script>
</body>
</html>
